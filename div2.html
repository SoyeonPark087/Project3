<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애국가</title>
    <Style>
        /* 여백초기화 */
        *{padding: 0; margin: 0;}
        div{
            /* 테두리선약식코딩 */
            border: 5px #000000 solid;
            /* 가로크기 */
            width: 510px;
            /* 배경색 */
            background-color: orange;
            padding: 16px;
            margin-bottom: 23px;
        }
    </Style>
</head>
<body>
    <div>
        <h1>애국가</h1>
    </div>

    <div>
        <p>
            동해물과 백두산이 마르고 닳도록<br>
            하느님이 보우하사 우리나라만세<br>
            무궁화 삼천리 화려강산<br>
            대한사람 대한으로 길이보전하세<br>
        </p>
    </div>
</body>
</html>
