<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 정해진 점수1 이상인 경우 A, 점수2 이상 B, 나머지는 C로 출력
        let jumsu = prompt("입사점수를 입력하세요")
        if(jumsu>=90){
            alert("발령부서 : 기획팀");
        }else if(jumsu>=80){
            alert("발령부서 : 총무팀");
        }else{
            alert("발령부서 : 영업팀");
        }
    </script>
</body>
</html>
