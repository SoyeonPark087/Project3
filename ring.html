<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반지의 제왕</title>
    <style>
        Body{
            text-align: center;
        }
            h1{
            color: red;
        }
        .p1{
            color: orange;
        }
        .p2{
            color: navy;
        }
        .p3{
            color: rgb(250, 250, 0);
        }
        .p4{
            color: green
        }
        .line1{
            width: 320px;
            height: 10px;
            background-color: purple;
            border: none
        }
        .line2{
            width: 390px;
        }
        .line3{
            width: 280px;
        }
        .line4{
            width: 350px;
        }
        .line5{
            width: 310px;
        }
        .line6{
            width: 500px;
        }
        .line7{
            width: 420px;
        }
    </style>
</head>
<body>
    <h1><ins>절대반지는?</ins></h1>
    <p class="p1"><strong>반지</strong> 세 개는 하늘 아래 <strong>요정왕</strong>들을 위한 것,</p>
    <hr class="line1">
    <p class="p2">일곱 개는 돌의 전당에 있는 <strong>난쟁이</strong> 군주들을 위한 것,</p>
    <hr class="line2">
    <p class="p3">아홉 개는 죽은 운명의 인간을 위한 것,</p>
    <hr class="line3">
    <p class="p1">하나는 암흑의 왕좌에 앉은 암흑 제왕을 위한 것.</p>
    <hr class="line4">
    <p class="p2">그곳은 망령들이 지배하는 <strike>모르도르</strike>의 땅,</p>
    <hr class="line5">
    <p class="p3">그 모든 반지를 다스릴 반지 하나, 그 모든 반지를 찾기 위한 절대반지,</p>
    <hr class="line6">
    <p class="p1">그 모든 반지를 암흑 속에 가두기 위한 반지는 절대반지뿐,</p>
    <hr class="line7">
    <p class="p2">바로 망령들이 누워 있는 모르도르의 땅에</p>
    <hr>
    <p class="p4"><em><small><strong>반지의 제왕</strong> 중에서..</small></em></p>

</body>
</html>
