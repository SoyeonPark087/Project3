<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1; i<=7; i++){
            document.write("저의 직업은 웹디자이너입니다.<br>")   
        }
        for(let j=1; j<=7; j++){
            document.write("저의 직업은 웹퍼블리셔입니다.<br>")   
        }
        for(let k=1; k<=7; k++){
            document.write("저의 직업은 프론드엔드 개발자입니다.<br>")   
        }
    </script>
    <hr>
    <script>
        function job(web){
            for(let k=1; k<=7; k++){
            document.write("저의 직업은 " + web + "입니다<br>")
        }}
        
        job("웹디자이너")
        job("웹퍼블리셔")
        job("프론트엔드 개발자")
    </script>

</body>
</html>
