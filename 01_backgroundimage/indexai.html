<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outback Quick Menu</title>

  <link rel="stylesheet" href="./css/styleai.css">
</head>

<body>

  <section class="quick-menu-section">

    <div class="quick-menu">

      <!-- 예약 -->
      <div class="quick-menu-item reserve">
        <a href="#" class="quick-menu-link">

          <div class="menu-text">
            <h2>RESERVE</h2>
            <p>예약하기</p>
          </div>

          <span class="menu-arrow"></span>

          <img
            src="./images/speed_menu_icon_02.png"
            alt="예약"
            class="menu-image"
          >

        </a>
      </div>


      <!-- 포인트 적립 -->
      <div class="quick-menu-item point">
        <a href="#" class="quick-menu-link">

          <div class="menu-text">
            <h2>SAVE POINT</h2>
            <p>사후 적립</p>
          </div>

          <span class="menu-arrow"></span>

          <img
            src="./images/speed_menu_icon_03.png"
            alt="사후 적립"
            class="menu-image"
          >

        </a>
      </div>


      <!-- 딜리버리 -->
      <div class="quick-menu-item delivery">
        <a href="#" class="quick-menu-link">

          <div class="menu-text">
            <h2>DELIVERY</h2>
            <p>딜리버리</p>
          </div>

          <span class="menu-arrow"></span>

          <img
            src="./images/speed_menu_icon_04.png"
            alt="OUTBACK Delivery"
            class="menu-image delivery-logo"
          >

        </a>
      </div>

    </div>

  </section>

</body>
</html>
