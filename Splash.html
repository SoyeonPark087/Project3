<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>스플래쉬 화면</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* 모바일 앱 전체 화면 */
        .app-screen {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 중앙 로고 영역 */
        .splash-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .splash-logo {
            display: block;
            width: 150px;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="app-screen">

        <!-- 중앙 로고 -->
        <main class="splash-content">
            <img
                class="splash-logo"
                src="./Images/logo.svg"
                alt="Camba 로고"
            >
        </main>

    </div>

    <script>
        setTimeout(function () {
            window.location.href = "./Onboarding1.html";
        }, 3000);
    </script>
</body>
</html>
