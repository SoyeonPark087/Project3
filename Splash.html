<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>스플래쉬화면</title>

    <style>
        /* 기본 설정 */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* 모바일 앱 전체 화면 */
        .app-screen {
            position: relative;
            width: 375px;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 상단 상태바 */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 375px;
            height: 44px;
        }

        /* 현재 시간 */
        .status-time {
            position: absolute;
            top: 14px;
            left: 32px;
            margin: 0;
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            line-height: 18px;
            letter-spacing: -0.3px;
        }

        /* 상태 아이콘 묶음 */
        .status-icons {
            position: absolute;
            top: 17px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* 통신 신호 아이콘 */
        .cellular-icon {
            display: flex;
            align-items: flex-end;
            width: 18px;
            height: 12px;
            gap: 2px;
        }

        .cellular-icon span {
            display: block;
            width: 3px;
            background-color: #000000;
            border-radius: 1px;
        }

        .cellular-icon span:nth-child(1) {
            height: 4px;
        }

        .cellular-icon span:nth-child(2) {
            height: 6px;
        }

        .cellular-icon span:nth-child(3) {
            height: 9px;
        }

        .cellular-icon span:nth-child(4) {
            height: 12px;
        }

        /* 와이파이 아이콘 */
        .wifi-icon {
            position: relative;
            width: 17px;
            height: 12px;
        }

        .wifi-line {
            position: absolute;
            left: 50%;
            display: block;
            border-top: 2px solid #000000;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        .wifi-line-1 {
            top: 1px;
            width: 17px;
            height: 10px;
        }

        .wifi-line-2 {
            top: 5px;
            width: 10px;
            height: 6px;
        }

        .wifi-dot {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 3px;
            height: 3px;
            background-color: #000000;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        /* 배터리 아이콘 */
        .battery-icon {
            position: relative;
            width: 22px;
            height: 11px;
            padding: 1px;
            border: 1.5px solid #000000;
            border-radius: 3px;
        }

        .battery-icon::after {
            content: "";
            position: absolute;
            top: 3px;
            right: -3px;
            width: 2px;
            height: 5px;
            background-color: #000000;
            border-radius: 0 1px 1px 0;
        }

        .battery-level {
            width: 16px;
            height: 7px;
            background-color: #000000;
            border-radius: 1px;
        }

        /* 중앙 로고 영역 */
        .splash-content {
            position: absolute;
            top: 44px;
            left: 0;
            width: 375px;
            height: 734px;
        }

        .splash-logo {
            position: absolute;
            top: 306px;
            left: 50%;
            display: block;
            width: 150px;
            height: auto;
            transform: translateX(-50%);
        }

        /* 하단 홈 인디케이터 영역 */
        .home-indicator-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 375px;
            height: 34px;
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            width: 134px;
            height: 5px;
            background-color: #000000;
            border-radius: 10px;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>
    <div class="app-screen">

        <!-- 상단 상태바 -->
        <header class="status-bar">
            <p class="status-time">9:41</p>

            <div class="status-icons">

                <!-- 통신 신호 -->
                <div class="cellular-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <!-- 와이파이 -->
                <div class="wifi-icon">
                    <span class="wifi-line wifi-line-1"></span>
                    <span class="wifi-line wifi-line-2"></span>
                    <span class="wifi-dot"></span>
                </div>

                <!-- 배터리 -->
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>

            </div>
        </header>

        <!-- 중앙 로고 -->
        <main class="splash-content">
            <img
                class="splash-logo"
                src="./Images/logo.svg"
                alt="Camba 로고"
            >
        </main>

        <!-- 하단 홈 인디케이터 -->
        <footer class="home-indicator-area">
            <div class="home-indicator"></div>
        </footer>

    </div>
    <script>
        setTimeout(function () {
            window.location.href = "./Onboarding1.html";
        }, 3000);
    </script>
</body>
</html>
