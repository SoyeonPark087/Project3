<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일아산병원</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="header">
        <button><img src= "./Images/menu.png" alt="햄버거버튼"></button>
        <h1>
            <a href="index.html"><img src= "./Images/logo.png" alt="로고"></a>
        </h1>
        <button><img src= "./Images/search.png" alt="검색버튼"></button>
    </div>

    <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
        <!-- Slides -->
        <div class="swiper-slide"><img src= ./Images/main1.png alt="메인배너1"></div>
        <div class="swiper-slide"><img src= ./Images/main2.png alt="메인배너2"></div>
        <div class="swiper-slide"><img src= ./Images/main3.png alt="메인배너3"></div>
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>

    <!-- If we need navigation buttons -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
