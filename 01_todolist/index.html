<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOIT - Todo</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="brand" aria-label="DOIT 홈" data-view="today">DOIT</a>

      <nav class="desktop-nav" aria-label="주 메뉴">
        <button class="nav-link active" type="button" data-view="today">
          오늘 <span id="todayCount" class="nav-count">0</span>
        </button>
        <button class="nav-link" type="button" data-view="inbox">
          받은 할 일 <span id="inboxCount" class="nav-count muted">0</span>
        </button>
        <button class="nav-link" type="button" data-view="upcoming">
          예정 <span id="upcomingCount" class="nav-count muted">0</span>
        </button>
        <button class="nav-link" type="button" data-view="category">카테고리</button>
      </nav>

      <div class="header-actions">
        <button id="searchButton" class="header-icon" type="button" aria-label="검색 필터로 이동">⌕</button>
        <button class="header-icon desktop-only" type="button" aria-label="설정">⚙</button>
        <button
          id="menuButton"
          class="menu-button"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <div id="mobileMenu" class="mobile-menu">
      <div class="mobile-menu-inner">
        <button class="mobile-nav-link active" type="button" data-view="today">
          오늘 <span id="mobileTodayCount" class="mobile-count">0</span>
        </button>
        <button class="mobile-nav-link" type="button" data-view="inbox">
          받은 할 일 <span id="mobileInboxCount" class="mobile-count">0</span>
        </button>
        <button class="mobile-nav-link" type="button" data-view="upcoming">
          예정 <span id="mobileUpcomingCount" class="mobile-count">0</span>
        </button>
        <div class="mobile-divider"></div>
        <div class="mobile-menu-label">카테고리</div>
        <button class="mobile-nav-link sub" type="button" data-category="work">회사</button>
        <button class="mobile-nav-link sub" type="button" data-category="personal">개인</button>
        <button class="mobile-nav-link sub" type="button" data-category="study">공부</button>
        <button class="mobile-nav-link sub" type="button" data-category="exercise">운동</button>
        <button class="mobile-nav-link sub" type="button" data-category="etc">기타</button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-container">
      <section class="page-heading">
        <div>
          <h1 id="pageTitle">오늘</h1>
          <p id="pageDescription" class="date-text"></p>
        </div>
        <div class="heading-status">
          <strong id="headingCount">0</strong>
          <span id="headingCountLabel">개의 할 일이 남았습니다</span>
        </div>
      </section>

      <section id="quickAddSection" class="quick-add-section">
        <form id="todoForm" class="quick-add">
          <span class="quick-add-icon">+</span>
          <input
            id="todoInput"
            type="text"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
            maxlength="100"
          >
          <button class="add-button" type="submit">추가</button>
        </form>
        <p id="quickAddHelp" class="quick-add-help">빠르게 제목만 추가하고, 목록에서 제목을 누르면 상세 정보를 설정할 수 있습니다.</p>
      </section>

      <section id="filterSection" class="filter-section" aria-label="할 일 필터">
        <div class="filter-search-wrap">
          <span class="filter-search-icon" aria-hidden="true">⌕</span>
          <input
            id="filterSearch"
            class="filter-search"
            type="search"
            placeholder="제목이나 메모 검색"
            autocomplete="off"
          >
        </div>

        <div class="filter-controls">
          <label class="filter-field">
            <span>상태</span>
            <select id="filterStatus">
              <option value="all">전체</option>
              <option value="active">미완료</option>
              <option value="completed">완료</option>
            </select>
          </label>

          <label class="filter-field">
            <span>우선순위</span>
            <select id="filterPriority">
              <option value="all">전체</option>
              <option value="high">높음</option>
              <option value="normal">보통</option>
              <option value="low">낮음</option>
            </select>
          </label>

          <label class="filter-field">
            <span>카테고리</span>
            <select id="filterCategory">
              <option value="all">전체</option>
              <option value="none">미분류</option>
              <option value="work">회사</option>
              <option value="personal">개인</option>
              <option value="study">공부</option>
              <option value="exercise">운동</option>
              <option value="etc">기타</option>
            </select>
          </label>

          <label class="filter-field sort-field">
            <span>정렬</span>
            <select id="filterSort">
              <option value="smart">기본순</option>
              <option value="dateAsc">날짜 빠른순</option>
              <option value="dateDesc">날짜 늦은순</option>
              <option value="priority">우선순위순</option>
              <option value="newest">최근 등록순</option>
              <option value="oldest">오래된 등록순</option>
            </select>
          </label>

          <button id="filterResetButton" class="filter-reset-button" type="button">초기화</button>
        </div>

        <div class="filter-result-row">
          <span id="filterResultText">전체 할 일을 표시하고 있습니다.</span>
          <span id="filterActiveBadge" class="filter-active-badge is-hidden">필터 적용 중</span>
        </div>
      </section>

      <section id="todoSection" class="todo-section">
        <div class="section-header">
          <div>
            <h2 id="listTitle">할 일</h2>
            <p id="listDescription">제목을 클릭하면 메모, 일정, 우선순위, 카테고리를 수정할 수 있습니다.</p>
          </div>
          <span id="todoSummary" class="todo-summary">0개 남음</span>
        </div>

        <div id="todoList" class="todo-list"></div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">✓</div>
          <strong id="emptyTitle">오늘 할 일이 없습니다.</strong>
          <p id="emptyDescription">새로운 할 일을 추가해보세요.</p>
        </div>
      </section>

      <section id="categoryPanel" class="category-panel">
        <div class="section-header">
          <div>
            <h2>카테고리</h2>
            <p>카테고리를 선택하면 해당 할 일만 모아서 볼 수 있습니다.</p>
          </div>
        </div>

        <div class="category-grid">
          <button class="category-card" type="button" data-category-filter="work">
            <span class="category-dot"></span>
            <div><strong>회사</strong><span data-category-count="work">0개</span></div>
          </button>
          <button class="category-card" type="button" data-category-filter="personal">
            <span class="category-dot"></span>
            <div><strong>개인</strong><span data-category-count="personal">0개</span></div>
          </button>
          <button class="category-card" type="button" data-category-filter="study">
            <span class="category-dot"></span>
            <div><strong>공부</strong><span data-category-count="study">0개</span></div>
          </button>
          <button class="category-card" type="button" data-category-filter="exercise">
            <span class="category-dot"></span>
            <div><strong>운동</strong><span data-category-count="exercise">0개</span></div>
          </button>
          <button class="category-card" type="button" data-category-filter="etc">
            <span class="category-dot"></span>
            <div><strong>기타</strong><span data-category-count="etc">0개</span></div>
          </button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <strong>DOIT</strong>
      <span>오늘 해야 할 일에 집중하세요.</span>
    </div>
  </footer>

  <div id="detailBackdrop" class="detail-backdrop"></div>

  <aside
    id="detailPanel"
    class="detail-panel"
    aria-hidden="true"
    aria-labelledby="detailHeading"
  >
    <div class="detail-header">
      <div>
        <span class="detail-kicker">TODO DETAIL</span>
        <h2 id="detailHeading">할 일 수정</h2>
      </div>
      <button id="detailCloseButton" class="detail-close" type="button" aria-label="상세 창 닫기">✕</button>
    </div>

    <form id="detailForm" class="detail-form">
      <input id="detailTodoId" type="hidden">

      <div class="form-field full">
        <label for="detailTitle">제목 <span>*</span></label>
        <input id="detailTitle" type="text" maxlength="100" required>
      </div>

      <div class="form-field full">
        <label for="detailMemo">메모</label>
        <textarea
          id="detailMemo"
          rows="5"
          maxlength="500"
          placeholder="필요한 내용이나 참고사항을 적어보세요."
        ></textarea>
      </div>

      <div class="form-grid">
        <div class="form-field">
          <label for="detailDate">날짜</label>
          <input id="detailDate" type="date">
        </div>

        <div class="form-field">
          <label for="detailTime">시간</label>
          <input id="detailTime" type="time">
        </div>
      </div>

      <button id="clearScheduleButton" class="text-button" type="button">날짜와 시간 지우기</button>

      <div class="form-grid">
        <div class="form-field">
          <label for="detailPriority">우선순위</label>
          <select id="detailPriority">
            <option value="high">높음</option>
            <option value="normal">보통</option>
            <option value="low">낮음</option>
          </select>
        </div>

        <div class="form-field">
          <label for="detailCategory">카테고리</label>
          <select id="detailCategory">
            <option value="none">미분류</option>
            <option value="work">회사</option>
            <option value="personal">개인</option>
            <option value="study">공부</option>
            <option value="exercise">운동</option>
            <option value="etc">기타</option>
          </select>
        </div>
      </div>

      <div class="detail-actions">
        <button id="detailDeleteButton" class="detail-delete-button" type="button">삭제</button>
        <button class="detail-save-button" type="submit">변경사항 저장</button>
      </div>
    </form>
  </aside>

  <div id="undoToast" class="undo-toast" role="status" aria-live="polite">
    <span>할 일을 삭제했습니다.</span>
    <button id="undoButton" type="button">실행 취소</button>
  </div>

  <script src="./js/storage.js"></script>
  <script src="./js/todo.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
