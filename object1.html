<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 DATA</title>
</head>
<body>
    <script>
        let jumsu = [100,90,80,70]
        console.log(jumsu)
        document.write(jumsu[2] + "<br>")
        document.write(`국어 점수 = ${jumsu[0]}<br>`)
        document.write(`영어 점수 = ${jumsu[1]}<br>`)
        document.write(`수학 점수 = ${jumsu[2]}<br>`)
        document.write(`과학 점수 = ${jumsu[3]}<br>`)

        document.write("<hr>")



        let score = {
            kor:100,
            eng:90,
            mat:80,
            sci:70,
        }

        document.write(`국어 점수 = ${score.kor}` + "<br>")
        document.write(`영어 점수 = ${score.eng}` + "<br>")
        document.write(`수학 점수 = ${score.mat}` + "<br>")
        document.write(`과학 점수 = ${score.sci}` + "<br>")

        document.write("<hr>")

        

        const car = {
            color:"검정",
            cc:3000,
            make:"현대자동차",
        }

        document.write(`색상 = ${car.color}` + "<br>")
        document.write(`배기량 = ${car.cc}` + "<br>")
        document.write(`제조사 = ${car.make}` + "<br>")
        console.log(car)

        document.write("<hr>")



        const sungjuk = {
            kor:100,
            eng:90,
            mat:80,
            sci:70,
        }

        document.write(`국어 = ${sungjuk["kor"]}` + "<br>")
        document.write(`영어 = ${sungjuk["eng"]}` + "<br>")
        document.write(`수학 = ${sungjuk["mat"]}` + "<br>")
        document.write(`과학 = ${sungjuk["sci"]}` + "<br>")

        document.write("<hr>")



        const scores = [100, 90, 80, 70,]
        const subjects = ["국어", "영어", "수학", "과학"]

        for(let i=0; i<scores.length; i++){
            document.write(`${subjects[i]} = ${scores[i]}<br>`)
        }

        document.write("<hr>")



        const jumsus = {
            kor:100,
            eng:90,
            mat:80,
            sci:70,
        }

        for(let subject in jumsus){
            document.write(`${subject}=${jumsus[subject]}<br>`)

        }

        document.write("<hr>")


        const book = {
            name:"미드나잇 라이브러리",
            writer:"매트 헤이그",
            price:"14,220원",
            date:"2021년 4월 28일",
            page:408,
            ISBN:"979119152168545(46516544534)" 
        }

        document.write(`책제목 : ${book.name}` + "<br>")
        document.write(`저자 : ${book.writer}` + "<br>")
        document.write(`가격 : ${book.price}` + "<br>")
        document.write(`출간일 : ${book.date}` + "<br>")
        document.write(`페이지 수 : ${book.page}` + "<br>")
        document.write(`ISBN : ${book.ISBN}` + "<br>")

    </script>
</body>
</html>
